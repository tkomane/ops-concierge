# GitHub Pages deploy — static demo only.
#
# Publishes https://tkomane.github.io/ops-concierge/
# `enablement: true` turns on Pages (GitHub Actions source) if not already set.
#
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload & deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/css _site/js
          cp index.html robots.txt favicon.svg icon-192.svg icon-maskable.svg manifest.webmanifest _site/
          # _headers is Cloudflare-oriented; harmless on Pages if present
          if [ -f _headers ]; then cp _headers _site/; fi
          cp css/*.css _site/css/
          cp js/*.js _site/js/
          # Ensure GitHub Pages does not run Jekyll on the artifact
          touch _site/.nojekyll
          echo "Static site contents:"
          find _site -type f | sort
          test -f _site/index.html
          test -f _site/css/app.css
          test -f _site/js/app.js
          test -f _site/js/theme.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
