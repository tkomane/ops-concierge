[project]
name = "ops-concierge-mcp"
version = "0.1.0"
description = "Self-hosted MCP Streamable HTTP server for Ops Concierge (Amazon Developer Hackathon Alexa+ path)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tshiamo Komane" }]
dependencies = [
  "mcp==2.1.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "anyio>=4.0",
  "httpx>=0.27",
]

[project.scripts]
ops-concierge-mcp = "mcp_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
